[CoreRedirects]
; Module rename: SequencerDialogue → SequencerSubtitles
+PackageRedirects=(OldName="/Script/SequencerDialogue", NewName="/Script/SequencerSubtitles")

; Class rename: Dialogue → Subtitle (v1.0 → v1.1)
+ClassRedirects=(OldName="MovieSceneDialogueTrack", NewName="MovieSceneSubtitleTrack")
+ClassRedirects=(OldName="MovieSceneDialogueSection", NewName="MovieSceneSeqSubtitleSection")
+ClassRedirects=(OldName="MovieSceneSubtitleSection", NewName="MovieSceneSeqSubtitleSection")

; Property rename: DialogueText → SubtitleText (v1.1). Without this, text saved with v1.0 loads empty.
+PropertyRedirects=(OldName="/Script/SequencerSubtitles.MovieSceneSeqSubtitleSection.DialogueText", NewName="SubtitleText")

; Struct rename: FDialogueAppearance → FSubtitleAppearance (v1.1). Without this, appearance overrides saved with v1.0 are lost.
; Full paths so that structs of the same name in other plugins are not redirected.
+StructRedirects=(OldName="/Script/SequencerSubtitles.DialogueAppearance", NewName="/Script/SequencerSubtitles.SubtitleAppearance")
+StructRedirects=(OldName="/Script/SequencerDialogue.DialogueAppearance", NewName="/Script/SequencerSubtitles.SubtitleAppearance")
